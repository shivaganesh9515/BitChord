name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux · AppImage, deb, rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v5

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        run: |
          ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test -Pslickchord.version=${{ steps.version.outputs.value }} || true

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pslickchord.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/SlickChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libslickchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        run: |
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/SlickChord \
            dist/SlickChord-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/SlickChord-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/SlickChord-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows · installer, msi, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v5

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test "-Pslickchord.version ${{ steps.version.outputs.value }}" || true

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pslickchord.version=${{ steps.version.outputs.value }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/SlickChord/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/slickchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/slickchord_smtc.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/SlickChord-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/SlickChord-$v-windows-x64-setup.exe"
          7z a -tzip -mx=5 "dist/SlickChord-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/SlickChord/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS · dmg, pkg, zip (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v5

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: |
          ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test -Pslickchord.version=${{ steps.version.outputs.value }} || true

      - name: Build DMG, PKG and the app bundle
        run: |
          ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg :desktopApp:createDistributable \
            -Pslickchord.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/SlickChord.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Collect
        run: |
          v="${{ steps.version.outputs.value }}"
          arch="${{ matrix.arch }}"
          mkdir -p dist
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "dist/SlickChord-$v-macos-$arch.dmg"
          done
          for f in desktopApp/build/compose/binaries/main/pkg/*.pkg; do
            [ -f "$f" ] && cp "$f" "dist/SlickChord-$v-macos-$arch.pkg"
          done
          ditto -c -k --keepParent desktopApp/build/compose/binaries/main/app/SlickChord.app "dist/SlickChord-$v-macos-$arch.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*

  android:
    name: Android · signed APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > slickchord-release.jks
          {
            echo "storeFile=slickchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build phone APKs
        run: ./gradlew :app:assembleProdRelease

      - name: Name APKs for SlickChord updater
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk "dist/SlickChord-$version.apk"
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk "dist/SlickChord-${version}_arm64-v8a.apk"
          cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk "dist/SlickChord-${version}_armeabi-v7a.apk"
          cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk "dist/SlickChord-${version}_x86_64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: dist/*

  release:
    name: Publish
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - name: Draft the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SlickChord ${{ github.ref_name }}
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
